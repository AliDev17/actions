name: Deploy Nginx

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pull Code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build -t mynginx .

      - name: Stop Old Container
        run: |
          docker stop mynginx || true
          docker rm mynginx || true

      - name: Run Container
        run: docker run -d -p 80:80 --name mynginx mynginx

      - name: Verify
        run: docker ps | grep mynginx
